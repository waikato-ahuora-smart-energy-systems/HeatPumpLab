[project]
name = "heatpumplab"
version = "0.1.1"
description = "Models of high-temperature heat pump cycles for industrial process heat, with CoolProp or REFPROP properties"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Tim Walmsley", email = "tim.walmsley@waikato.ac.nz" },
]
requires-python = ">=3.12"
keywords = [
    "heat pump", "high-temperature heat pump", "thermodynamics", "process heat",
    "industrial decarbonisation", "CoolProp", "REFPROP",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "coolprop>=8.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.7.0",
    "scipy>=1.17.1",
    "botorch>=0.18.1",
    # imported directly by the BO code (also pulled in by botorch)
    "torch>=2.14.0",
    "gpytorch>=1.15.2",
]

[project.urls]
Homepage = "https://waikato-ahuora-smart-energy-systems.github.io/HeatPumpLab/"
Repository = "https://github.com/waikato-ahuora-smart-energy-systems/HeatPumpLab"
Documentation = "https://github.com/waikato-ahuora-smart-energy-systems/HeatPumpLab#readme"
Issues = "https://github.com/waikato-ahuora-smart-energy-systems/HeatPumpLab/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# only the package: experiments/, local_scripts/ and scripts/ are not part of it
packages = ["HeatPumpLab"]

[tool.hatch.build.targets.sdist]
include = ["/HeatPumpLab", "/README.md", "/LICENSE", "/CITATION.cff", "/pyproject.toml"]

[project.optional-dependencies]
# REFPROP backend: needs a licensed NIST REFPROP installation as well
refprop = [
    "ctrefprop>=0.10.5",
]

[dependency-groups]
benchmark = [
    "cma>=4.4.4",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
# Frozen experiment copies have duplicate module names and run separately.
testpaths = ["tests"]
filterwarnings = [
    # linear_operator's import-time @torch.jit.script (see HeatPumpLab/__init__.py)
    "ignore:`torch\\.jit\\.script` is deprecated:FutureWarning",
]
