[project]
name = "heatpumplab"
version = "0.1.0"
description = "Digital lab for simulation of heat pumps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ctrefprop>=0.10.5",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.7.0",
    "scipy>=1.17.1",
    "botorch>=0.18.1",
]

[dependency-groups]
benchmark = [
    "cma>=4.4.4",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
# Frozen experiment copies have duplicate module names and run separately.
testpaths = ["tests"]
filterwarnings = [
    # linear_operator's import-time @torch.jit.script (see HeatPumpLab/__init__.py)
    "ignore:`torch\\.jit\\.script` is deprecated:FutureWarning",
]
