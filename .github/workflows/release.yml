# Build the package and publish it to PyPI when a GitHub release is published (Zenodo archives the same release).
# Uses PyPI trusted publishing, so no token is stored: PyPI must list this repository, this workflow (release.yml)
# and the "pypi" environment as a trusted publisher for the heatpumplab project. Run it by hand to publish an
# existing tag.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the package version
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          test "${tag#v}" = "$version" || { echo "tag $tag does not match pyproject version $version"; exit 1; }
      - name: Build
        run: uv build
      - name: Check the distributions
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/heatpumplab/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
