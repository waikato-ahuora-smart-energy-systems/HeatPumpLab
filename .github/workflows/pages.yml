# Publish the web apps in apps/ (landing page, dryer and steam heat pump apps) to GitHub Pages.
# Enable it once under Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths: ["apps/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the apps (without their sources in apps/src)
        run: rsync -a --exclude src/ apps/ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
