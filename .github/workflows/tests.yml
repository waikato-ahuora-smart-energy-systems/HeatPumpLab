# Lint and run the test suite on the CoolProp backend, on each supported Python version, for every pull request (REFPROP is commercial and
# not available here; its tests skip themselves).
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: suite (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    env:
      HEATPUMPLAB_PROPERTY_BACKEND: coolprop
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check --select F HeatPumpLab tests
      - name: Apps are built from their sources
        run: |
          uv run python apps/src/steam/build.py
          uv run python apps/src/dryer/build.py
          git diff --exit-code -- apps/steam apps/dryer
      - name: Tests
        run: uv run pytest -q -p no:cacheprovider

  # The one check main's branch protection requires: passes only when the suite passes on every Python version.
  test:
    if: always()
    needs: suite
    runs-on: ubuntu-latest
    steps:
      - name: All Python versions passed
        run: test "${{ needs.suite.result }}" = "success"
