name: Feature or cycle request
description: Suggest a new cycle, an option for an existing one, or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like
      description: The cycle, option or change, and the application it is for.
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Reference
      description: A paper, report or dataset that describes the cycle or gives results to check against, if there is one.
